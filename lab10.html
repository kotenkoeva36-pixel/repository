<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Казино</title>
<style>
* {
    box-sizing: border-box;
}
body {
    margin: 0;
    min-height: 100vh;
    padding: 20px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #ffd6e9, #ed9bc9, #c98bdf);
    color: white;
}
.casino {
    width: 100%;
    max-width: 480px;
    padding: 28px 20px;
    text-align: center;
    background: linear-gradient(145deg, #9e427b, #642957);
    border: 3px solid #ffd0e8;
    border-radius: 28px;
    box-shadow: 0 0 35px #ff6eb7;
}
h1 {
    margin: 0;
    font-size: 31px;
    color: #ffe0ef;
    text-shadow: 0 0 15px #ffb5da;
}
.player {
    font-size: 21px;
    font-weight: bold;
    color: #ffe1f0;
    margin-bottom: 12px;
}
.attempt {
    margin-bottom: 18px;
    color: #ffd9ec;
    font-size: 17px;
}
.slots {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 9px;
    padding: 12px;
    background: #ffb6d9;
    border: 4px solid #ffe0ef;
    border-radius: 18px;
    box-shadow: 0 0 20px #ff8dc5;
}
.cell {
    aspect-ratio: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(145deg, #fff5fa, #ffd0e6);
    border: 2px solid #ed9bc9;
    border-radius: 13px;
    font-size: clamp(34px, 10vw, 52px);
    transition: 0.3s;
}
.cell.winner {
    background: linear-gradient(145deg, #fff1a8, #ff8acb);
    border: 3px solid #fff4a8;
    box-shadow: 0 0 15px #fff3a0, 0 0 25px #ff4eaa;
    transform: scale(1.04);
    animation: glow 0.8s infinite alternate;
}
@keyframes glow {
    from {
        box-shadow: 0 0 10px #fff3a0;
    }
    to {
        box-shadow: 0 0 25px #fff3a0, 0 0 35px #ff4eaa;
    }
}
button {
    width: 100%;
    padding: 15px;
    margin-top: 18px;
    border: 2px solid #ffe4f1;
    border-radius: 30px;
    background: linear-gradient(90deg, #ff9acb, #ff5fa9);
    color: white;
    font-size: 19px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
}
button:hover {
    transform: scale(1.04);
    box-shadow: 0 0 20px #ffb5da;
}
button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none;
}
#result {
    min-height: 55px;
    margin-top: 20px;
    color: #ffe5a9;
    font-size: 17px;
    font-weight: bold;
}
.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(45, 10, 35, 0.8);
    justify-content: center;
    align-items: center;
    padding: 20px;
    z-index: 10;
}
.modal-content {
    width: 100%;
    max-width: 350px;
    padding: 25px;
    text-align: center;
    background: linear-gradient(145deg, #ffb6d9, #bd70a5);
    border: 3px solid #ffe5f1;
    border-radius: 25px;
    box-shadow: 0 0 30px #ff80c0;
}
.modal-content h2 {
    color: white;
}
.modal-content p {
    color: #fff5fa;
}
.payment-info {
    padding: 15px;
    margin: 15px 0;
    background: #fff0f7;
    color: #913d70;
    border-radius: 15px;
    overflow-wrap: anywhere;
}
.payment-info p {
    color: #913d70;
}
@media (max-width: 400px) {
    .casino {
        padding: 20px 12px;
    }
    h1 {
        font-size: 25px;
    }
}
</style>
</head>
<body>
<div class="casino">
    <h1>🎀 КАЗИНО 🎀</h1>
    <div class="player" id="player"></div>
    <div class="attempt" id="attempt">Спроба 1 з 3</div>
    <div class="slots" id="slots"></div>
    <button id="play" onclick="generate()">💗 ГРАТИ 💗</button>
    <div id="result"> Випробуй удачу</div>
    <button onclick="showPayment()">🎀 ГРАТИ ЩЕ 🎀</button>
</div>
<div class="modal" id="payment">
    <div class="modal-content">
        <h2>🎀 Дякую за гру 🎀</h2>
        <p>Вікно оплати для продовження гри 🥰</p>
        <div class="payment-info">
            <p>💗 Сума: 1000 грн</p>
            <p>💳 Номер карти: </p>
            <strong>4441 1110 3803 8034</strong>
            <p>✨Вирогідність виграшу зростає кожну хвилину</p>
        </div>
        <button onclick="copyDetails()"> СКОПІЮВАТИ та виграти</button>
        <button onclick="closePayment()"> ЗАКРИТИ та програти</button>
    </div>
</div>
<script>
let name = prompt("Введіть своє ім'я:");
while (name !== null && name.trim() === "") {
    name = prompt("Будь ласка, введіть своє ім'я:");
}
if (name === null || name.trim() === "") {
    name = "Принцеса";
}
document.getElementById("player").textContent =
    "👑 " + name + " 👑";
const symbols = ["🎀", "💄", "💎", "🌸", "👑", "💍"];
let attempts = 0;
let finished = false;

const slots = document.getElementById("slots");
for (let i = 0; i < 9; i++) {
    let cell = document.createElement("div");
    cell.className = "cell";
    cell.textContent = "❔";
    slots.appendChild(cell);
}

function generate() {
    if (finished) return;
    attempts++;
    let field = [];

    for (let col = 0; col < 3; col++) {
        let available = [...symbols];
        for (let row = 0; row < 3; row++) {
            let index = Math.floor(Math.random() * available.length );
            field[row * 3 + col] = available[index];
            available.splice(index, 1);
        }
    }
    let cells = document.querySelectorAll(".cell");
    cells.forEach((cell, i) => {
        cell.textContent = field[i];
        cell.classList.remove("winner");
    });
	
    let win = false;
    for (let row = 0; row < 3; row++) {
        let a = field[row * 3];
        let b = field[row * 3 + 1];
        let c = field[row * 3 + 2];

        if (a === b && b === c) {
            win = true;
            for (let col = 0; col < 3; col++) {
                cells[row * 3 + col]
                    .classList.add("winner");
            }
        }
    }
    document.getElementById("attempt").textContent ="Спроба " + attempts + " з 3";
    if (win) {
        document.getElementById("result").textContent ="🎉 ПЕРЕМОГА! Вітаємо, " + name + "🎀";
        finishGame();
    } else if (attempts === 3) {
        document.getElementById("result").textContent ="💗 Спроби закінчилися. Почни нову гру";
        finishGame();
    } else {
        document.getElementById("result").textContent ="✨ Спробуй ще! Залишилося спроб: " +(3 - attempts);
    }
}
function finishGame() {
    finished = true;
    document.getElementById("play").disabled = true;
    document.getElementById("play").textContent ="ГРУ ЗАВЕРШЕНО";
}
function showPayment() {
    document.getElementById("payment").style.display ="flex";
}

function closePayment() {
    document.getElementById("payment").style.display ="none";
    attempts = 0;
    finished = false;
    document.getElementById("attempt").textContent ="Спроба 1 з 3";
    document.getElementById("result").textContent ="Нова гра! Бажаємо удачі! 💗";
    document.getElementById("play").disabled = false;
    document.getElementById("play").textContent ="💗 ГРАТИ 💗";
    document.querySelectorAll(".cell").forEach(cell => {
        cell.textContent = "❔";
        cell.classList.remove("winner");
    });
}
function copyDetails() {
    navigator.clipboard.writeText("4441 1110 3803 8034").then(() => {
        alert("Реквізити скопійовано! 💗");
    }).catch(() => {
        alert("Не вдалося скопіювати реквізити.");
    });
}
</script>
</body>
</html>
